<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="640" height="520" fill="#ffffff"/>

  <!-- head and neck -->
  <path d="M430,40 C330,22 230,30 182,70 C150,98 146,128 150,150 C138,170 112,190 100,206 C96,214 104,220 124,222
           C120,230 114,238 118,246 C121,252 122,256 120,262 C114,270 116,280 126,288 C130,298 124,312 128,328
           C134,344 160,352 210,352 C240,352 262,356 272,372 C278,410 276,460 274,520 L520,520
           C512,470 500,420 506,380 C520,330 556,280 552,220 C548,140 510,62 430,40 Z"
        fill="#F6E1D0" stroke="#A47B60" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- nasal cavity -->
  <path d="M128,214 C150,196 196,176 260,170 C320,166 368,172 392,190 C396,200 392,206 384,210
           C350,204 300,200 250,202 C200,204 160,212 128,214 Z"
        fill="#E3EFF9" stroke="#86B4DA" stroke-width="1.6" stroke-dasharray="5 4"/>

  <!-- vocal tract: the air space from the vocal folds to the lips -->
  <path d="M120,252 C132,250 142,248 154,246 C190,236 226,222 262,214 C296,208 326,210 340,216
           C352,226 362,240 372,252 C380,246 384,236 384,224 C386,214 390,208 396,206
           C402,240 404,330 400,418 L362,418
           C360,380 360,330 358,290 C356,262 350,246 338,238 C320,228 290,226 262,230
           C226,236 190,250 160,262 C146,266 134,266 120,262 Z"
        fill="#BFDDF5" stroke="#4C8CC2" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- hard palate (bone) and soft palate (velum) -->
  <path d="M150,244 C186,226 226,208 264,202 C298,198 326,200 342,206 L342,216 C326,210 296,208 262,214
           C226,222 190,236 154,250 Z" fill="#EFE9DF" stroke="#9A9183" stroke-width="1.4"/>
  <path d="M340,206 C356,210 372,222 380,238 C382,248 378,256 372,256 C362,246 352,228 340,216 Z"
        fill="#F2CFC0" stroke="#B07A66" stroke-width="1.4"/>

  <!-- teeth -->
  <path d="M146,238 L156,236 L157,252 L149,253 Z" fill="#ffffff" stroke="#9A9183" stroke-width="1.2"/>
  <path d="M147,264 L156,262 L157,278 L148,278 Z" fill="#ffffff" stroke="#9A9183" stroke-width="1.2"/>

  <!-- lips -->
  <path d="M118,246 C112,238 116,230 126,230 C140,230 152,236 156,244 C146,248 130,250 118,246 Z"
        fill="#DC8A80" stroke="#A4544B" stroke-width="1.4"/>
  <path d="M118,264 C130,262 146,264 156,268 C152,280 140,288 128,286 C116,284 112,272 118,264 Z"
        fill="#DC8A80" stroke="#A4544B" stroke-width="1.4"/>

  <!-- tongue -->
  <path d="M158,264 C190,250 226,236 262,230 C292,226 322,230 340,240 C354,250 358,272 358,300
           C358,330 356,360 352,384 C330,380 300,350 270,334 C230,318 190,304 166,290 C154,282 152,270 158,264 Z"
        fill="#E8908F" stroke="#B04A4A" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M190,280 C230,272 280,272 320,290" fill="none" stroke="#C86A6A" stroke-width="1" opacity="0.6"/>

  <!-- jaw bone hint -->
  <path d="M150,300 C160,330 200,340 260,338" fill="none" stroke="#D8C2B0" stroke-width="5" stroke-linecap="round"/>

  <!-- spine -->
  <g fill="#EFE9DF" stroke="#B6AC9D" stroke-width="1.2">
    <rect x="424" y="210" width="40" height="34" rx="8"/><rect x="426" y="250" width="40" height="34" rx="8"/>
    <rect x="428" y="290" width="40" height="34" rx="8"/><rect x="430" y="330" width="40" height="34" rx="8"/>
    <rect x="432" y="370" width="40" height="34" rx="8"/><rect x="434" y="410" width="40" height="34" rx="8"/>
    <rect x="436" y="450" width="40" height="34" rx="8"/><rect x="438" y="490" width="40" height="30" rx="8"/>
  </g>

  <!-- larynx: Adam's apple, vocal folds, windpipe below -->
  <path d="M362,424 C364,470 366,500 368,520 L396,520 C396,490 398,460 400,424 Z" fill="#E9F3FB" stroke="#86B4DA" stroke-width="1.4"/>
  <path d="M362,412 L379,421 L362,428 Z" fill="#D9868A" stroke="#9C4A50" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M400,412 L383,421 L400,428 Z" fill="#D9868A" stroke="#9C4A50" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M381,505 L381,445" stroke="#4C8CC2" stroke-width="2" marker-end="url(#up)"/>
  <defs><marker id="up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4C8CC2"/></marker></defs>

  <!-- labels -->
  <g font-size="17" fill="#10233F" stroke="none">
    <text x="232" y="160" text-anchor="middle">nasal cavity</text>
    <text x="252" y="292" text-anchor="middle" fill="#7A2626">tongue</text>
    <text x="40" y="262" text-anchor="middle">lips</text>
    <text x="548" y="300">throat</text>
    <text x="548" y="320" font-size="13" fill="#5C6B80">(pharynx)</text>
    <text x="548" y="416" font-weight="700" fill="#9C4A50">vocal folds</text>
  </g>
  <g stroke="#5C6B80" stroke-width="1.1" fill="none">
    <path d="M58,258 L112,256"/>
    <path d="M544,296 L486,296 L390,300"/>
    <path d="M544,412 L486,412 L402,420"/>
  </g>

  <!-- what the vocal tract is -->
  <g font-size="15" fill="#2E6E9E">
    <text x="70" y="420" font-weight="700" font-size="17">vocal tract (shaded blue)</text>
    <text x="40" y="442">= the air space from the</text>
    <text x="40" y="461">vocal folds up to the lips</text>
    <text x="40" y="480" font-size="13" fill="#5C6B80">(plus the nasal cavity when the</text>
    <text x="40" y="497" font-size="13" fill="#5C6B80">soft palate lowers, e.g. for m, n)</text>
  </g>
  <rect x="40" y="406" width="22" height="16" rx="3" fill="#BFDDF5" stroke="#4C8CC2" stroke-width="1.4"/>
  <text x="356" y="478" font-size="12" fill="#5C6B80" text-anchor="end">air from</text><text x="356" y="493" font-size="12" fill="#5C6B80" text-anchor="end">the lungs</text>
</svg>
